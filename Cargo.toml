[package]
name = "filesystem_delta"
version = "0.1.0"
edition = "2021"

[dependencies]
walkdir = "2"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
filetime = "0.2"
hex = "0.4"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"

[lib]
name = "filesystem_delta"
path = "src/lib.rs"
